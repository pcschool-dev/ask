<!doctype html>
<!--
  หน้าครอบของโรงเรียน (pcschool-dev.github.io/ask/) ฉบับมีหน้าโหลด

  ปัญหาที่แก้: ช่วง 1–5 วินาทีแรก Google กำลังบูต Apps Script — iframe เป็นสีขาวล้วน
  และไม่มีโค้ดฝั่งระบบประเมินตัวไหนช่วยได้ เพราะยังไม่มีสักไบต์ไปถึงเบราว์เซอร์
  หน้านี้เป็น static จึงโผล่ทันที แล้วแสดงหน้าโหลดทับไว้จนแอปโหลดเสร็จ

  วิธีใช้: แทนที่ index.html เดิมของหน้า ask/ ด้วยไฟล์นี้ (แก้ APP_URL ให้ตรง)
  ของเดิมมีตัวกันแคช ?t=<เวลา> อยู่แล้ว — คงพฤติกรรมนั้นไว้ให้ในสคริปต์ด้านล่าง
-->
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ระบบประเมินครูผู้สอน | โรงเรียนปากช่อง</title>
<style>
  :root { --brand: #0d6efd; }             /* เปลี่ยนเป็นสีประจำโรงเรียนได้ */
  html, body { margin: 0; height: 100%; background: #fff;
               font-family: 'Sarabun', Tahoma, sans-serif; }
  iframe { display: block; width: 100%; height: 100%; border: 0; }

  /* หน้าโหลด — ทับเต็มจอจนกว่าแอปจะพร้อม */
  #loader { position: fixed; inset: 0; z-index: 10; background: #fff;
            display: flex; align-items: center; justify-content: center;
            transition: opacity .25s ease; }
  #loader.hide { opacity: 0; pointer-events: none; }
  .box { text-align: center; max-width: 340px; padding: 0 24px; }
  .mark { width: 64px; height: 64px; margin: 0 auto 14px; border-radius: 18px;
          display: flex; align-items: center; justify-content: center; font-size: 30px;
          background: var(--brand); box-shadow: 0 8px 24px rgba(16,24,40,.18);
          position: relative; overflow: hidden; }
  /* โลโก้จริงเฟดทับ 🎓 เมื่อโหลดเสร็จ — โหลดพลาดจะถอดตัวเองทิ้ง เหลืออิโมจิ ไม่มีรูปแตก */
  .mark .logo { position: absolute; inset: 0; width: 100%; height: 100%;
                object-fit: contain; padding: 7px; box-sizing: border-box;
                background: #fff; border-radius: inherit;
                opacity: 0; transition: opacity .25s ease; }
  .mark.has-logo .logo { opacity: 1; }
  .school { font-weight: 700; font-size: 1.05rem; color: #1f2937; }
  .system { font-size: .85rem; color: #6b7280; margin-bottom: 16px; }
  .bar { height: 4px; border-radius: 2px; background: #e9ecef; overflow: hidden;
         margin: 0 28px 10px; }
  .bar span { display: block; height: 100%; width: 40%; border-radius: 2px;
              background: var(--brand); animation: slide 1.1s ease-in-out infinite; }
  @keyframes slide { 0% { margin-left: -40%; } 100% { margin-left: 100%; } }
  .note { font-size: .8rem; color: #8c98a4; }
  #slow { display: none; margin-top: 14px; }
  #slow a { display: inline-block; padding: 8px 14px; border: 1px solid #d0d5dd;
            border-radius: 10px; color: #344054; text-decoration: none; font-size: .85rem; }
  @media (prefers-reduced-motion: reduce) { .bar span { animation: none; width: 100%; } }
</style>
</head>
<body>

<div id="loader">
  <div class="box">
    <!-- วางไฟล์ logo.png ไว้โฟลเดอร์เดียวกับหน้านี้ (หรือแก้ src เป็น URL เต็ม)
         ไม่มีไฟล์ก็ปล่อยไว้ได้ — โหลดพลาดแท็กจะถอดตัวเองทิ้ง เหลือ 🎓 -->
    <div class="mark">🎓<img class="logo" alt="" src="logo.png"
         onload="this.parentElement.classList.add('has-logo')"
         onerror="this.remove()"></div>
    <div class="school">โรงเรียนปากช่อง</div>
    <div class="system">ระบบประเมินครูผู้สอนรายวิชา</div>
    <div class="bar"><span></span></div>
    <div class="note" id="note">กำลังเปิดระบบ…</div>
    <div id="slow">
      <a href="javascript:location.reload()">โหลดช้าผิดปกติ — แตะเพื่อลองใหม่</a>
    </div>
  </div>
</div>

<iframe id="app" allow="clipboard-write" referrerpolicy="no-referrer"></iframe>

<script>
  // === แก้บรรทัดนี้ให้ตรงกับ URL /exec ของระบบ ===
  var APP_URL = 'https://script.google.com/macros/s/AKfycbxfzMGdxvEy4GIZ39migmyXMtss2W4jme7bdNhlkt-kBgoAhZu-uqbP6rYVSGaNJyQssw/exec';

  var frame  = document.getElementById('app');
  var loader = document.getElementById('loader');
  var t0 = Date.now();

  // คงตัวกันแคช ?t=<เวลา> ของหน้าเดิมไว้ (ฝั่งระบบกันพารามิเตอร์นี้ชนกับ deep link ให้แล้ว)
  frame.src = APP_URL + (APP_URL.indexOf('?') >= 0 ? '&' : '?') + 't=' + Date.now();

  /*
   * ซ่อนหน้าโหลดเมื่อ iframe โหลดเสร็จ — บังคับโชว์ขั้นต่ำ 600ms กันกะพริบ
   * (โหลดเร็ว ๆ แล้วหน้าโหลดแวบเดียวหาย ดูเหมือนจอกระตุกมากกว่าดูโปร)
   * หมายเหตุ: onload ของ iframe บอกได้แค่ "เอกสารชั้นนอกของ Google มาแล้ว"
   * splash ภายในแอปจะรับช่วงต่อเองอย่างกลมกลืน เพราะหน้าตาออกแบบให้เหมือนกัน
   */
  frame.addEventListener('load', function () {
    var wait = Math.max(0, 600 - (Date.now() - t0));
    setTimeout(function () { loader.classList.add('hide'); }, wait);
  });

  // เกิน 15 วินาทีแล้วยังไม่มา — เปิดทางให้ผู้ใช้ช่วยตัวเอง แทนที่จะจ้องแถบวิ่งเปล่า ๆ
  setTimeout(function () {
    if (loader.classList.contains('hide')) return;
    document.getElementById('note').textContent = 'การเชื่อมต่อช้ากว่าปกติ';
    document.getElementById('slow').style.display = 'block';
  }, 15000);
</script>
</body>
</html>
