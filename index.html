<!DOCTYPE html>
<html lang="th">
<head>
    <html lang="th">
    <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ระบบประเมินครูผู้สอน | โรงเรียนปากช่อง</title>
    <link rel="icon" type="image/x-icon" href="Logo.png">
    <script src="https://unpkg.com/@dotlottie/player-component@2.7.12/dist/dotlottie-player.mjs" type="module"></script>
    <style>
        :root { --brand: #0d6efd; }             /* เปลี่ยนเป็นสีประจำโรงเรียนได้ */
        html, body { margin: 0;  padding: 0; width: 100%; height: 100%; background: #fff;
                     font-family: 'Sarabun', Tahoma, sans-serif;
                     overflow: hidden; /* ป้องกันการเลื่อนหน้าจอขณะโหลด */}
        iframe { display: block; width: 100%; height: 100%; position: absolute; top: 0;left: 0;border: none;}
      
        /* หน้าโหลด — ทับเต็มจอจนกว่าแอปจะพร้อม */
        #loader { position: fixed; inset: 0; z-index: 10; background: #fff;
                  display: flex; align-items: center; justify-content: center;
                  transition: opacity .25s ease; }
        #loader.hide { opacity: 0; pointer-events: none; }
        .box { text-align: center; max-width: 340px; padding: 0 24px; }
        .mark { width: 64px; height: 64px; margin: 0 auto 14px; border-radius: 18px;
                display: flex; align-items: center; justify-content: center; font-size: 30px;
                background: var(--brand); box-shadow: 0 8px 24px rgba(16,24,40,.18);
                position: relative; overflow: hidden; }
        /* โลโก้จริงเฟดทับ 🎓 เมื่อโหลดเสร็จ — โหลดพลาดจะถอดตัวเองทิ้ง เหลืออิโมจิ ไม่มีรูปแตก
           สไตล์สองชั้นเดียวกับ splash ในแอป: กล่องสีแบรนด์ชั้นนอก + แผ่นโปร่งขาวชั้นในรองตรา
           ขนาดต้องระบุตรง ๆ — <img> ที่ absolute ไม่ยืดตาม inset ถ้าปล่อย width/height เป็น auto */
        .mark .logo { position: absolute; top: 8px; left: 8px;
                      width: calc(100% - 16px); height: calc(100% - 16px);
                      object-fit: contain; padding: 5px; box-sizing: border-box;
                      background: rgba(255,255,255,.28); border-radius: 12px;
                      opacity: 0; transition: opacity .25s ease; }
        .mark.has-logo .logo { opacity: 1; }
        /* โลโก้มาแล้วซ่อน 🎓 (เป็น text node จึงใช้ font-size แทนการเลือกตัวอักษรตรง ๆ) */
        .mark.has-logo { font-size: 0; }
        .school { font-weight: 700; font-size: 1.05rem; color: #1f2937; }
        .system { font-size: .85rem; color: #6b7280; margin-bottom: 16px; }
        .bar { height: 4px; border-radius: 2px; background: #e9ecef; overflow: hidden;
               margin: 0 28px 10px; }
        .bar span { display: block; height: 100%; width: 40%; border-radius: 2px;
                    background: var(--brand); animation: slide 1.1s ease-in-out infinite; }
        @keyframes slide { 0% { margin-left: -40%; } 100% { margin-left: 100%; } }
        .note { font-size: .8rem; color: #8c98a4; }
        #slow { display: none; margin-top: 14px; }
        #slow a { display: inline-block; padding: 8px 14px; border: 1px solid #d0d5dd;
                  border-radius: 10px; color: #344054; text-decoration: none; font-size: .85rem; }
        @media (prefers-reduced-motion: reduce) { .bar span { animation: none; width: 100%; } }
       
    </style>
</head>
<body>
    <!-- หน้าแจ้งเตือน Facebook (ปรับให้ใช้ class กึ่งกลาง) -->
    <div id="FBloading" class="full-screen-center" style="display:none;">
        <h4 style="font-family: 'Sarabun', sans-serif; line-height: 1.6;">
            โปรดเปิดด้วย เบราว์เซอร์ภายนอก <br>
            <span style="color: #666; font-size: 0.9em;">Please open in external browser.</span>
        </h4>       
    </div>  

    <!-- หน้า Loading หลัก -->
    <div id="loader">
      <div class="box">
        <!-- วางไฟล์ logo.png ไว้โฟลเดอร์เดียวกับหน้านี้ (หรือแก้ src เป็น URL เต็ม)
             ไม่มีไฟล์ก็ปล่อยไว้ได้ — โหลดพลาดแท็กจะถอดตัวเองทิ้ง เหลือ 🎓 -->
        <!-- referrerpolicy เผื่อกรณีแก้ src เป็นลิงก์ googleusercontent ซึ่งปฏิเสธ referrer ข้ามโดเมน -->
        <div class="mark">🎓<img class="logo" alt="" referrerpolicy="no-referrer" src="logo.png"
             onload="this.parentElement.classList.add('has-logo')"
             onerror="this.remove()"></div>
        <div class="school">โรงเรียนปากช่อง</div>
        <div class="system">ระบบประเมินครูผู้สอนรายวิชา</div>
        <div class="bar"><span></span></div>
        <div class="note" id="note">กำลังเปิดระบบ…</div>
        <div id="slow">
          <a href="javascript:location.reload()">โหลดช้าผิดปกติ — แตะเพื่อลองใหม่</a>
        </div>
      </div>
    </div>
    
    <iframe id="link" allow="clipboard-write" referrerpolicy="no-referrer"></iframe>

    <script type="text/javascript">
        let preloader = document.getElementById("loading");
        let FBloading = document.getElementById("FBloading");
        let link = document.getElementById("link");
        let directLink = document.getElementById("directLink");
        let idUID = window.location.search;
        let param = new URLSearchParams(idUID);
        let id = param.get('fbclid');
        let idApply = param.get('id');
        let page = param.get('ln');
        
        // ต่อ query string ให้ถูกไวยากรณ์เสมอ ไม่ว่าจะมีพารามิเตอร์กี่ตัว แล้วปิดท้ายด้วย t= กัน cache
        // (ของเดิมชื่อ getNoCacheUrl ต่อ "?id=..." แล้วเติม "?" ซ้ำอีกตัว ทำให้ค่า id
        //  กลายเป็น "...?t=123" — ตอนนี้แยกด้วย & ถูกต้องแล้ว)
        function buildUrl(baseUrl, params) {
            let q = [];
            for (let k in params) {
                let v = params[k];
                if (v !== undefined && v !== null && v !== "")
                    q.push(encodeURIComponent(k) + "=" + encodeURIComponent(v));
            }
            q.push("t=" + Date.now());
            return baseUrl + (baseUrl.includes('?') ? '&' : '?') + q.join('&');
        }

        // ── ตั๋ว SSO จากระบบส่งการบ้าน ────────────────────────────────
        // ระบบส่งการบ้านพาผู้ใช้มาที่ .../check/#sso=<ตั๋ว>
        // hash อ่านได้เฉพาะที่หน้านี้ — Apps Script เสิร์ฟหน้าเว็บใน iframe ซ้อนอีกชั้น
        // (googleusercontent) hash จึงไปไม่ถึงโค้ดข้างใน ต้องส่งต่อเป็น query string ?sso=
        // ซึ่งวิ่งอยู่ในวงของ Google เท่านั้น ไม่ติดไปกับ Referer และไม่โผล่ใน log ของ GitHub
        function takeSsoTicket() {
            let m = String(location.hash || "").match(/[#&]sso=([^&]+)/);
            if (!m) return "";
            let t;
            try { t = decodeURIComponent(m[1]); } catch (e) { t = m[1]; }
            // รับเฉพาะอักษรของ base64 web-safe — ยัดอย่างอื่นเข้า URL ไม่ได้
            if (!/^[A-Za-z0-9_-]+$/.test(t)) t = "";
            // ลบตั๋วออกจาก address bar ทันที ไม่ให้ค้างใน history หรือติดไปกับภาพหน้าจอ
            try { history.replaceState(null, '', location.pathname + location.search); }
            catch (e) { location.hash = ''; }
            return t;
        }

        const baseAppScript = "https://script.google.com/a/macros/pcschool.ac.th/s/AKfycbxfzMGdxvEy4GIZ39migmyXMtss2W4jme7bdNhlkt-kBgoAhZu-uqbP6rYVSGaNJyQssw/exec";

        // ฟังก์ชันช่วยปิด Loading แบบนิ่มนวล
        function hideLoader() {
            preloader.style.opacity = '0';
            setTimeout(() => {
                preloader.style.display = 'none';
            }, 500);
        }

        if(id){
            preloader.style.display = 'none';
            FBloading.style.display = 'flex'; // ใช้ flex เพื่อให้กึ่งกลาง
            // ... (โค้ดหน่วงเวลาเดิมของคุณ) ...
            let countDownDate = new Date(Date.now() + 15000).getTime();   	
            let x = setTimeout(function(){
                let now = new Date().getTime();
                let distance = countDownDate - now;                
                let seconds = Math.floor((distance % (1000 * 60)) / 1000);
                if(seconds == 13){
                    FBloading.innerHTML = `<iframe scrolling="auto" src="openExternalBrowser.mp4"></iframe>`
                } else if(seconds <= 0){
                    clearInterval(x);
                    window.location.href = 'https://pcschool-dev.github.io/ask'
                }  				
            }, 1000); // ทุก ๆ 1 วิ
        
        } else if (page) {
             // ตั๋วต้องหยิบก่อนสร้าง URL — และหยิบครั้งเดียวเท่านั้น
            // ใส่ไปกับทุกทางเข้า (iframe / fallback เต็มแท็บ / ลิงก์กดเอง) เพราะถ้า iframe
            // ถูกบล็อก ผู้ใช้ยังต้องได้ SSO เหมือนกัน ตั๋วอายุ 2 นาที ครอบคลุม fallback 10 วิสบาย ๆ
            let newweb = baseAppScript + "?ln=" + page;
            let finalUrl = buildUrl(newweb, { id: idApply, sso: takeSsoTicket() });

            let settled = false;

            // สำรอง: ถ้าฝังใน iframe ไม่ได้ (เช่น โดน X-Frame-Options: SAMEORIGIN
            // ตอน Google เด้งไปหน้า login) onload จะไม่ยิงภายในเวลาที่กำหนด
            // -> เปลี่ยนไปเปิดลิงก์ /exec ตรง ๆ ทั้งแท็บ เพื่อให้ล็อกอิน/ใช้งานต่อได้
            let fallbackTimer = setTimeout(function () {
                if (settled) return;
                settled = true;
                window.location.replace(finalUrl);
            }, 10000); // เวลารอ iframe ก่อนตัดสินใจ fallback (มิลลิวินาที) — ปรับได้

            // ใช้ iframe เป็นหลัก: ถ้าโหลดในกรอบสำเร็จ -> ยกเลิก fallback แล้วแสดงเต็มจอ
            link.onload = function () {
                if (settled) return;
                settled = true;
                clearTimeout(fallbackTimer);
                hideLoader();
                link.style.display = 'block';
            };

            link.src = finalUrl;

            // ลิงก์สำรองแบบกดเอง — โผล่ขึ้นถ้ารอนานเกินไป (ตาข่ายกันพลาด
            // เผื่อบางเบราว์เซอร์ตรวจการบล็อก iframe อัตโนมัติไม่ได้)
            directLink.href = finalUrl;
            setTimeout(function () {
                if (!settled) directLink.style.display = 'inline-block';
            }, 3000); // เวลาโผล่ลิงก์สำรอง (มิลลิวินาที) — ปรับได้
            
        } else {
            // ตั๋วต้องหยิบก่อนสร้าง URL — และหยิบครั้งเดียวเท่านั้น
            // ใส่ไปกับทุกทางเข้า (iframe / fallback เต็มแท็บ / ลิงก์กดเอง) เพราะถ้า iframe
            // ถูกบล็อก ผู้ใช้ยังต้องได้ SSO เหมือนกัน ตั๋วอายุ 2 นาที ครอบคลุม fallback 10 วิสบาย ๆ
            let finalUrl = buildUrl(baseAppScript, { id: idApply, sso: takeSsoTicket() });

            let settled = false;

            // สำรอง: ถ้าฝังใน iframe ไม่ได้ (เช่น โดน X-Frame-Options: SAMEORIGIN
            // ตอน Google เด้งไปหน้า login) onload จะไม่ยิงภายในเวลาที่กำหนด
            // -> เปลี่ยนไปเปิดลิงก์ /exec ตรง ๆ ทั้งแท็บ เพื่อให้ล็อกอิน/ใช้งานต่อได้
            let fallbackTimer = setTimeout(function () {
                if (settled) return;
                settled = true;
                window.location.replace(finalUrl);
            }, 10000); // เวลารอ iframe ก่อนตัดสินใจ fallback (มิลลิวินาที) — ปรับได้

            // ใช้ iframe เป็นหลัก: ถ้าโหลดในกรอบสำเร็จ -> ยกเลิก fallback แล้วแสดงเต็มจอ
            link.onload = function () {
                if (settled) return;
                settled = true;
                clearTimeout(fallbackTimer);
                hideLoader();
                link.style.display = 'block';
            };

            link.src = finalUrl;

            // ลิงก์สำรองแบบกดเอง — โผล่ขึ้นถ้ารอนานเกินไป (ตาข่ายกันพลาด
            // เผื่อบางเบราว์เซอร์ตรวจการบล็อก iframe อัตโนมัติไม่ได้)
            directLink.href = finalUrl;
            setTimeout(function () {
                if (!settled) directLink.style.display = 'inline-block';
            }, 8000); // เวลาโผล่ลิงก์สำรอง (มิลลิวินาที) — ปรับได้
        }
    </script>
</body>    
</html>
